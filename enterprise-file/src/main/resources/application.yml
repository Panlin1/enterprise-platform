server:
  port: 8085

spring:
  application:
    name: enterprise-file
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        fail-fast: false
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}

# 文件存储
file:
  storage:
    local-base-dir: ${FILE_LOCAL_DIR:./data/files}     # ← 冒号后加空格
  upload:
    max-size: 10485760
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,txt

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 7200
  is-read-header: true
  token-prefix: Bearer
  is-print: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.enterprise.file: INFO
