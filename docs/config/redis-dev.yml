# =============================================================================
# 本地开发 Redis 配置片段
# 用法：复制到各服务 application-dev.yml，或后续放入 Nacos shared 配置
# 敏感信息使用环境变量，禁止提交真实生产密码
# =============================================================================

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

# 可选：Actuator 健康检查（监控阶段开启）
# management:
#   health:
#     redis:
#       enabled: true
