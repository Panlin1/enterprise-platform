# =============================================================================
# Nacos 共享配置示例
# 在 Nacos 控制台创建 Data ID，例如：
#   Data ID: common-redis.yml   Group: DEFAULT_GROUP
#   Data ID: common-mysql.yml  Group: DEFAULT_GROUP
